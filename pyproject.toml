[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "celeste-gpt-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3", "openai>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
dashboard = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.ruff]
exclude = [".deps"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
